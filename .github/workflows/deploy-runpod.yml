name: Deploy to RunPod

on:
  push:
    branches: [main, develop]
    paths:
      - 'app/**'
      - 'runpod_gateway/**'
      - 'scripts/**'
      - 'deploy/runpod/**'
      - 'requirements.txt'
  workflow_dispatch:
    inputs:
      tag_suffix:
        description: 'Sufijo del tag (default: auto-incrementa)'
        required: false

env:
  REGISTRY_IMAGE: develazquez01/casei-runpod

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate image tag
        id: tag
        run: |
          DATE=$(date +%Y%m%d)
          SUFFIX="${{ github.event.inputs.tag_suffix }}"
          if [ -z "$SUFFIX" ]; then
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            SUFFIX="$SHORT_SHA"
          fi
          TAG="worker-${DATE}-${SUFFIX}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "image=${{ env.REGISTRY_IMAGE }}:$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/runpod/Dockerfile
          push: true
          tags: |
            ${{ steps.tag.outputs.image }}
            ${{ env.REGISTRY_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update RunPod pod
        if: env.RUNPOD_API_KEY != ''
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_POD_ID: ${{ secrets.RUNPOD_POD_ID }}
        run: |
          IMAGE="${{ steps.tag.outputs.image }}"
          curl -s -X POST "https://api.runpod.io/graphql?api_key=${RUNPOD_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"query\": \"mutation { podEditJob(input: {podId: \\\"${RUNPOD_POD_ID}\\\", imageName: \\\"${IMAGE}\\\"}) { id imageName } }\"}"
          echo ""
          echo "Pod updated with image: $IMAGE"

      - name: Summary
        run: |
          echo "### Deploy completado" >> $GITHUB_STEP_SUMMARY
          echo "- **Imagen:** \`${{ steps.tag.outputs.image }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
