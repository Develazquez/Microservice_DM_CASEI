services:
  api:
    build:
      context: ../..
      dockerfile: deploy/cpu/Dockerfile
    image: casei-academic-segmentation:latest
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: ${CASEI_ENV_FILE:-.env.production}
    environment:
      CASEI_ML_WORKER_ENABLED: "false"
    ports:
      - "8000:8000"
    volumes:
      - ../../artifacts:/opt/casei/artifacts
      - ../../data:/opt/casei/data
    restart: unless-stopped

  worker:
    image: casei-academic-segmentation:latest
    command: ["python", "scripts/run_ml_worker.py"]
    env_file: ${CASEI_ENV_FILE:-.env.production}
    environment:
      CASEI_ML_WORKER_ENABLED: "true"
    volumes:
      - ../../artifacts:/opt/casei/artifacts
      - ../../data:/opt/casei/data
    restart: unless-stopped
    depends_on:
      - api
